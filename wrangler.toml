name = "livepad"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Optional: serve from your own domain instead of *.workers.dev
# routes = [{ pattern = "pad.example.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "PAD"
class_name = "Pad"

# Per-IP limit on login attempts. namespace_id is any number unique in your account.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "7401"
simple = { limit = 10, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pad"]

# secrets: PAD_USER, PAD_PASS, SESSION_SECRET  (wrangler secret put ...)
